<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bônus Exclusivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        @keyframes pulse-neon {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 25px 6px rgba(37, 99, 235, 0.5);
            }
        }

        .btn-pulse {
            animation: pulse-neon 1.4s infinite ease-in-out;
        }

        @keyframes progress-shrink {
            from { width: 100%; }
            to { width: 0%; }
        }

        .progress-bar {
            animation: progress-shrink 10s linear forwards;
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xs bg-slate-900/90 backdrop-blur-md border border-blue-500/30 rounded-3xl p-6 text-center shadow-[0_0_50px_rgba(37,99,235,0.15)] relative overflow-hidden">
        
        <!-- Barra de progresso no topo -->
        <div class="absolute top-0 left-0 w-full h-1 bg-slate-800">
            <div class="progress-bar h-full bg-gradient-to-r from-cyan-400 to-blue-600"></div>
        </div>

        <!-- Ícone de Destaque -->
        <div class="w-12 h-12 mx-auto mb-4 rounded-2xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7" />
            </svg>
        </div>

        <!-- Título -->
        <h1 class="text-lg font-black uppercase tracking-tight leading-snug mb-2">
            Bônus de <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">300% Liberado</span> no 1º Depósito
        </h1>

        <p class="text-xs text-slate-400 font-medium mb-6">
            Registe-se agora para ativar o seu saldo extra antes que o tempo acabe.
        </p>

        <!-- Botão Azul Pulsante -->
        <a href="https://go.aff.olabetpartners.com/8wvyemwj" 
           class="btn-pulse block w-full bg-gradient-to-r from-blue-600 via-blue-500 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-black text-sm py-3.5 rounded-xl uppercase tracking-wider transition-colors shadow-lg">
            ATIVAR BÔNUS AGORA
        </a>

        <!-- Contador -->
        <div class="mt-4 text-[11px] text-slate-500 font-semibold">
            A abrir automaticamente em <span id="timer" class="text-cyan-400 font-bold">10</span>s
        </div>

    </div>

    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        const targetUrl = "https://go.aff.olabetpartners.com/8wvyemwj";

        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                timerElement.textContent = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>

</body>
</html>
